<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>idol-mlx turntable</title>
<style>html, body { margin: 0; background: #0d1117; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<script type="module">
// Renders evenly spaced orbit views of one splat and POSTs each frame as a PNG data URL to /frame.
import * as THREE from 'three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const report = (path, body) => fetch(path, { method: 'POST', body });
window.addEventListener('error', e => report('/error', String(e.message)));
window.addEventListener('unhandledrejection', e => report('/error', String(e.reason)));

const cfg = await (await fetch('config.json')).json();
const [cx, cy, cz] = cfg.center;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(cfg.size, cfg.size);
renderer.setClearColor(new THREE.Color(cfg.background), 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const splats = new GaussianSplats3D.DropInViewer({ sharedMemoryForWorkers: false, gpuAcceleratedSort: false });
scene.add(splats);

const nextFrame = () => new Promise(r => requestAnimationFrame(r));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const render = () => renderer.render(scene, camera);

// 3DGS files are y-down: "up" is -y, and the object faces -z.
camera.up.set(0, -1, 0);
function place(angle) {
  camera.position.set(cx + cfg.radius * Math.sin(angle), cy - cfg.height, cz - cfg.radius * Math.cos(angle));
  camera.lookAt(cx, cy, cz);
}

await splats.addSplatScene('splat.ply', { format: GaussianSplats3D.SceneFormat.Ply, showLoadingUI: false });
place(cfg.startAngle);
for (let k = 0; k < 20; k++) { render(); await nextFrame(); await sleep(50); }

for (let i = 0; i < cfg.frames; i++) {
  place(cfg.startAngle + (2 * Math.PI * i) / cfg.frames);
  // The depth sort runs asynchronously; give it a few frames to catch up with the new camera.
  for (let k = 0; k < 4; k++) { render(); await nextFrame(); await sleep(40); }
  render();
  await report(`/frame?i=${i}`, renderer.domElement.toDataURL('image/png'));
}
await report('/done', '');
</script>
</body>
</html>
