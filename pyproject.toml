[project]
name = "idol-mlx"
version = "0.1.1"
description = "Photo to 3D Gaussian splat in ~15 s on a Mac: Idol + Idol Turbo on Apple Silicon (unofficial)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["gaussian-splatting", "image-to-3d", "mlx", "apple-silicon", "3dgs"]
classifiers = [
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "huggingface_hub>=0.25",
    "numpy>=1.26",
    "pillow>=10",
    "rich>=13",
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/cfahlgren1/idol-mlx"

[project.scripts]
idol-mlx = "idol_mlx.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idol_mlx"]

[tool.hatch.build.targets.sdist]
exclude = ["assets/", "DESIGN.md"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
